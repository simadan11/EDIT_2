# LUMEN Remote Control — Cloudflare Workers фасад
name = "lumen-remote"
main = "worker.js"
compatibility_date = "2026-01-01"

# ── Что поменять перед деплоем ─────────────────────────────────────────────
# ORIGIN — постоянный URL вашего именного туннеля на ПК (Путь A из README),
#          напр. https://lumen.example.com  (быстрый trycloudflare-URL НЕ
#          подходит — он меняется при каждом запуске).
# SECRET — ваша длинная случайная строка, вторая «дверь» поверх PIN приложения.
[vars]
ORIGIN = "https://lumen.example.com"
SECRET = "change-me-to-a-long-random-string"

# Подключение своего домена (необязательно): раскомментируйте и укажите свой.
# routes = [ { pattern = "remote.example.com/*", custom_domain = true } ]

