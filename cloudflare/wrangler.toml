# EDIT Remote Control — Cloudflare Workers фасад
name = "edit-remote"
main = "worker.js"
compatibility_date = "2026-01-01"

# ORIGIN — постоянный URL вашего именного туннеля на ПК.
# SECRET задавайте командой:  wrangler secret put SECRET
[vars]
ORIGIN = "https://edit.example.com"

# Подключение своего домена (необязательно):
# routes = [ { pattern = "remote.example.com/*", custom_domain = true } ]
