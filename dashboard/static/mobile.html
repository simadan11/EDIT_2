<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#00d4ff">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <title>MARK L — Mobile Access</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    :root {
      --bg: #07090f;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --accent: #00d4ff;
      --adim: rgba(0,212,255,0.15);
      --text: #dde3ed;
      --muted: #5e6a7e;
      --success: #10b981;
      --error: #f87171;
    }
    
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }
    
    /* Face ID Screen */
    #face-login {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
      z-index: 1000;
    }
    
    .face-container {
      width: 280px;
      height: 280px;
      position: relative;
      margin-bottom: 30px;
    }
    
    .face-ring {
      position: absolute;
      inset: 0;
      border: 3px solid var(--border);
      border-radius: 50%;
      transition: border-color 0.3s;
    }
    
    .face-ring.scanning {
      border-color: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    
    .face-ring.success {
      border-color: var(--success);
    }
    
    .face-ring.error {
      border-color: var(--error);
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    
    .face-video {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    
    .scan-line {
      position: absolute;
      left: 10%;
      right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      top: 50%;
      transform: translateY(-50%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .scanning .scan-line {
      opacity: 1;
      animation: scan 2s ease-in-out infinite;
    }
    
    @keyframes scan {
      0%, 100% { top: 30%; }
      50% { top: 70%; }
    }
    
    .face-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }
    
    .face-subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 30px;
      text-align: center;
    }
    
    .face-status {
      font-size: 14px;
      color: var(--accent);
      min-height: 20px;
      margin-top: 20px;
      text-align: center;
    }
    
    .face-btn {
      margin-top: 20px;
      padding: 14px 40px;
      background: var(--accent);
      color: #000;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    
    .face-btn:active {
      transform: scale(0.96);
    }
    
    .face-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    /* Main App */
    #app {
      display: none;
      min-height: 100vh;
      padding: 20px;
      padding-top: 40px;
    }
    
    .app.active {
      display: block;
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }
    
    .welcome {
      font-size: 20px;
      font-weight: 600;
    }
    
    .welcome-name {
      color: var(--accent);
    }
    
    .logout-btn {
      padding: 8px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }
    
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .card-icon {
      font-size: 20px;
    }
    
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    
    .action-btn {
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .action-btn:active {
      transform: scale(0.96);
      background: var(--adim);
    }
    
    .action-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }
    
    .action-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    
    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    
    .status-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .status-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .status-value {
      font-size: 16px;
      font-weight: 600;
    }
    
    .assistant-badge {
      display: inline-block;
      padding: 6px 12px;
      background: var(--adim);
      border: 1px solid var(--accent);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin-top: 8px;
    }
    
    .error-msg {
      color: var(--error);
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .fade-in {
      animation: fadeIn 0.4s ease;
    }
  </style>
</head>
<body>
  <!-- Face ID Login Screen -->
  <div id="face-login">
    <div class="face-container" id="face-container">
      <div class="face-ring" id="face-ring">
        <video id="face-video" class="face-video" autoplay playsinline muted></video>
        <div class="scan-line"></div>
      </div>
    </div>
    
    <div class="face-title">MARK L</div>
    <div class="face-subtitle">Подтвердите личность для входа</div>
    
    <button class="face-btn" id="scan-btn">СКАНИРОВАТЬ ЛИЦО</button>
    
    <button class="face-btn" id="enroll-btn" style="background: transparent; border: 2px solid var(--accent); color: var(--accent); margin-top: 12px; display: none;">
      ЗАРЕГИСТРИРОВАТЬ ЛИЦО
    </button>
    
    <div class="face-status" id="face-status"></div>
    <div class="error-msg" id="face-error"></div>
  </div>
  
  <!-- Main App (hidden until authenticated) -->
  <div id="app">
    <div class="header fade-in">
      <div class="welcome">
        Привет, <span class="welcome-name" id="user-name">Владелец</span>
      </div>
      <button class="logout-btn" onclick="logout()">Выйти</button>
    </div>
    
    <div class="card fade-in">
      <div class="card-title">
        <span class="card-icon">🤖</span>
        Ассистент
      </div>
      <div>Ваш персональный AI активен</div>
      <div class="assistant-badge" id="assistant-name">EDIT</div>
    </div>
    
    <div class="quick-actions fade-in">
      <div class="action-btn" onclick="quickAction('camera')">
        <div class="action-icon">📷</div>
        <div class="action-label">Камера</div>
      </div>
      <div class="action-btn" onclick="quickAction('search')">
        <div class="action-icon">🔍</div>
        <div class="action-label">Поиск</div>
      </div>
      <div class="action-btn" onclick="quickAction('files')">
        <div class="action-icon">📁</div>
        <div class="action-label">Файлы</div>
      </div>
      <div class="action-btn" onclick="quickAction('settings')">
        <div class="action-icon">⚙️</div>
        <div class="action-label">Настройки</div>
      </div>
    </div>
    
    <div class="card fade-in">
      <div class="card-title">
        <span class="card-icon">📊</span>
        Статус системы
      </div>
      <div class="status-grid">
        <div class="status-item">
          <div class="status-label">Соединение</div>
          <div class="status-value" style="color: var(--success);">● Активно</div>
        </div>
        <div class="status-item">
          <div class="status-label">Безопасность</div>
          <div class="status-value" style="color: var(--success);">● FaceID</div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    let videoStream = null;
    let isScanning = false;
    
    // Check FaceID status on load
    async function checkFaceIDStatus() {
      try {
        const response = await fetch('/api/face-auth/status');
        const result = await response.json();
        
        if (result.ok) {
          const enrollBtn = document.getElementById('enroll-btn');
          if (!result.has_faces) {
            showError('Нет зарегистрированных лиц. Зарегистрируйте лицо владельца.');
            enrollBtn.style.display = 'block';
            enrollBtn.addEventListener('click', () => startEnrollment());
          } else {
            enrollBtn.style.display = 'none';
            console.log(`FaceID готов: ${result.enrolled_count} лиц зарегистрировано`);
          }
          
          // Update assistant name if available
          if (result.assistant_name) {
            sessionStorage.setItem('jarvis_assistant_name', result.assistant_name);
          }
          if (result.user_name) {
            sessionStorage.setItem('jarvis_user_name', result.user_name);
          }
        }
      } catch (err) {
        console.error('Failed to check FaceID status:', err);
      }
    }
    
    // Initialize camera
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 640 },
            height: { ideal: 640 }
          }
        });
        
        videoStream = stream;
        const video = document.getElementById('face-video');
        video.srcObject = stream;
        
        return true;
      } catch (err) {
        showError('Нет доступа к камере. Разрешите доступ в настройках браузера.');
        return false;
      }
    }
    
    // Capture frame and send to server
    async function captureAndVerify() {
      if (isScanning) return;
      
      isScanning = true;
      const btn = document.getElementById('scan-btn');
      const ring = document.getElementById('face-ring');
      const status = document.getElementById('face-status');
      const error = document.getElementById('face-error');
      
      btn.disabled = true;
      ring.classList.add('scanning');
      status.textContent = 'Сканирование...';
      error.textContent = '';
      
      try {
        const video = document.getElementById('face-video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);
        
        // Convert to JPEG base64
        const jpegData = canvas.toDataURL('image/jpeg', 0.85);
        const base64Data = jpegData.split(',')[1];
        
        // Send to server for face verification
        const response = await fetch('/api/face-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ frame: base64Data })
        });
        
        const result = await response.json();
        
        if (result.ok && result.authenticated) {
          // Success!
          ring.classList.remove('scanning');
          ring.classList.add('success');
          status.textContent = '✓ Распознавание успешно';
          status.style.color = 'var(--success)';
          
          // Store auth token
          sessionStorage.setItem('jarvis_face_auth', 'true');
          sessionStorage.setItem('jarvis_user_name', result.user_name || 'Владелец');
          sessionStorage.setItem('jarvis_assistant_name', result.assistant_name || 'EDIT');
          
          // Stop camera
          if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
          }
          
          // Show main app
          setTimeout(() => {
            document.getElementById('face-login').style.display = 'none';
            const app = document.getElementById('app');
            app.classList.add('active');
            
            // Personalize
            document.getElementById('user-name').textContent = result.user_name || 'Владелец';
            document.getElementById('assistant-name').textContent = result.assistant_name || 'EDIT';
          }, 800);
          
        } else {
          // Failed
          ring.classList.remove('scanning');
          ring.classList.add('error');
          status.textContent = '✗ Лицо не распознано';
          status.style.color = 'var(--error)';
          error.textContent = result.error || 'Попробуйте еще раз';
          
          setTimeout(() => {
            ring.classList.remove('error');
            status.textContent = '';
            status.style.color = 'var(--accent)';
            error.textContent = '';
            btn.disabled = false;
            isScanning = false;
          }, 2000);
        }
        
      } catch (err) {
        console.error('Capture error:', err);
        showError('Ошибка сканирования. Попробуйте снова.');
        ring.classList.remove('scanning');
        btn.disabled = false;
        isScanning = false;
      }
    }
    
    function showError(msg) {
      const error = document.getElementById('face-error');
      error.textContent = msg;
    }
    
    // Face enrollment (registration)
    async function startEnrollment() {
      const name = prompt('Введите ваше имя (для идентификации):');
      if (!name || !name.trim()) return;
      
      const btn = document.getElementById('enroll-btn');
      const ring = document.getElementById('face-ring');
      const status = document.getElementById('face-status');
      const error = document.getElementById('face-error');
      
      btn.disabled = true;
      ring.classList.add('scanning');
      status.textContent = 'Регистрация лица...';
      error.textContent = '';
      
      try {
        const video = document.getElementById('face-video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);
        
        const jpegData = canvas.toDataURL('image/jpeg', 0.85);
        const base64Data = jpegData.split(',')[1];
        
        const response = await fetch('/api/face-enroll', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ frame: base64Data, name: name.trim() })
        });
        
        const result = await response.json();
        
        if (result.ok) {
          ring.classList.remove('scanning');
          ring.classList.add('success');
          status.textContent = '✓ Лицо зарегистрировано!';
          status.style.color = 'var(--success)';
          
          setTimeout(() => {
            ring.classList.remove('success');
            status.textContent = '';
            status.style.color = 'var(--accent)';
            error.textContent = '';
            btn.disabled = false;
            btn.style.display = 'none';
            // Re-check status
            checkFaceIDStatus();
          }, 2500);
          
        } else {
          ring.classList.remove('scanning');
          ring.classList.add('error');
          status.textContent = '✗ Ошибка регистрации';
          status.style.color = 'var(--error)';
          error.textContent = result.error || 'Попробуйте еще раз';
          
          setTimeout(() => {
            ring.classList.remove('error');
            status.textContent = '';
            status.style.color = 'var(--accent)';
            btn.disabled = false;
          }, 2500);
        }
        
      } catch (err) {
        console.error('Enrollment error:', err);
        showError('Ошибка регистрации');
        ring.classList.remove('scanning');
        btn.disabled = false;
      }
    }
    
    function quickAction(action) {
      alert(`Функция "${action}" будет доступна в полной версии`);
    }
    
    function logout() {
      sessionStorage.removeItem('jarvis_face_auth');
      sessionStorage.removeItem('jarvis_user_name');
      sessionStorage.removeItem('jarvis_assistant_name');
      location.reload();
    }
    
    // Check if already authenticated
    if (sessionStorage.getItem('jarvis_face_auth') === 'true') {
      document.getElementById('face-login').style.display = 'none';
      const app = document.getElementById('app');
      app.classList.add('active');
      document.getElementById('user-name').textContent = sessionStorage.getItem('jarvis_user_name') || 'Владелец';
      document.getElementById('assistant-name').textContent = sessionStorage.getItem('jarvis_assistant_name') || 'EDIT';
    } else {
      // Check FaceID status and initialize camera
      checkFaceIDStatus();
      initCamera().then(ok => {
        if (ok) {
          document.getElementById('scan-btn').addEventListener('click', captureAndVerify);
        }
      });
    }
  </script>
</body>
</html>
